name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign unsigned APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/bin/apksigner"
          "$APKSIGNER" sign \
            --ks app/release.keystore \
            --ksPassword "$ANDROID_KEYSTORE_PASS" \
            --ksKeyAlias "$ANDROID_KEY_ALIAS" \
            --ksKeyPassword "$ANDROID_KEY_PASS" \
            --min-sdk-version 24 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename for versioning
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Arkanzabel-${{ github.ref_name }}.apk"

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: Arkanzabel-${{ github.ref_name }}.apk
          generate_release_notes: true
