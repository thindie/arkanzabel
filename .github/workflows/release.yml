name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 \
            -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/release.keystore

      # Fetch the pinned native kernel (libv2ray) from upstream releases and
      # verify its sha256 BEFORE building. The AAR is git-ignored in
      # v2ray-engine/libs/, so a clean checkout has no kernel unless CI downloads it.
      # Pin both version and hash for reproducible builds. If the hash ever needs
      # updating after a kernel bump, recompute with:
      #   curl -fL "https://github.com/2dust/AndroidLibV2rayLite/releases/download/<ver>/libv2ray.aar" | sha256sum
      - name: Download pinned libv2ray kernel
        env:
          KERNEL_VERSION: 'v26.9.9'
          EXPECTED_SHA256: '9ecf4c921568d8f4cb8550d3bafe08ff6f1d1984f45a6ad183dcdf52ee9302de'
        run: |
          set -euo pipefail
          mkdir -p v2ray-engine/libs
          curl -fL --retry 3 --max-time 300 \
            -o v2ray-engine/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibV2rayLite/releases/download/${KERNEL_VERSION}/libv2ray.aar"
          echo "${EXPECTED_SHA256}  v2ray-engine/libs/libv2ray.aar" | sha256sum -c -

      - name: Build release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WEBDAV_DEFAULT_BASE_URL: ${{ secrets.WEBDAV_DEFAULT_BASE_URL }}
          WEBDAV_DEFAULT_USERNAME: ${{ secrets.WEBDAV_DEFAULT_USERNAME }}
          WEBDAV_DEFAULT_PASSWORD: ${{ secrets.WEBDAV_DEFAULT_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreleaseTag="$RELEASE_TAG" --no-daemon --stacktrace

      - name: Sign unsigned APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/bin/apksigner"
          "$APKSIGNER" sign \
            --ks app/release.keystore \
            --ksPassword "$ANDROID_KEYSTORE_PASS" \
            --ksKeyAlias "$ANDROID_KEY_ALIAS" \
            --ksKeyPassword "$ANDROID_KEY_PASS" \
            --min-sdk-version 24 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename for versioning
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Arkanzabel-${{ github.ref_name }}.apk"

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: Arkanzabel-${{ github.ref_name }}.apk
          generate_release_notes: true
